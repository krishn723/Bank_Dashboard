{% extends 'auth.html' %}{% set eyebrow='PROFILE' %}{% set heading='Personal details' %}{% set subtext='Update your account information.' %}{% block form %}<form method="post"><label>Full name<input name="name" value="{{user.name}}" required></label><label>Email<input type="email" name="email" value="{{user.email}}" required></label><label>Mobile number<input value="{{user.phone}}" disabled></label><label>Account number<input value="{{user.account_no}}" disabled></label><button class="btn primary full">Save changes</button></form>{% endblock %}
