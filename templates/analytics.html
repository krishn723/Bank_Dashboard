{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">FINANCIAL INSIGHTS</span><h1>Account analytics</h1><p class="muted">A visual view of your stored transaction data.</p></div></div><div class="analytics-grid"><div class="panel"><h3>Spending by category</h3><canvas id="categoryChart"></canvas></div><div class="panel"><h3>Monthly cash flow</h3><canvas id="monthlyChart"></canvas></div></div><div class="stats"><div><span>Current balance</span><b>₹{{'%.2f'|format(balance)}}</b></div><div><span>Categories</span><b>{{categories|length}}</b></div><div><span>Months tracked</span><b>{{monthly|length}}</b></div></div><script>window.analyticsData={{categories|tojson}};window.monthlyData={{monthly|tojson}};</script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="{{url_for('static',filename='js/charts.js')}}"></script>{% endblock %}
